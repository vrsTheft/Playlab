<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLab</title>
    <!-- Font Awesome for category icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #111113;
            --header-bg: #1a1a1e;
            --card-bg: #1a1a1e;
            --card-hover: #26262c;
            --accent-color: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --badge-new: #3b82f6;
            --border-color: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
        }

        .logo-img {
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-container {
            position: relative;
        }

        .search-bar {
            background-color: #2c2c35;
            border: none;
            border-radius: 20px;
            padding: 8px 15px 8px 35px;
            color: white;
            width: 220px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            align-items: center;
        }

        .header-icons i:hover, .header-icons i.active {
            color: var(--accent-color);
        }

        /* Request Games Button */
        .request-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .request-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        /* User Profile & Auth Styling */
        #userProfile {
            display: none;
            align-items: center;
            gap: 8px;
            background: #2c2c35;
            padding: 4px 10px 4px 4px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        #userAvatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        #userName {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            max-width: 90px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
        }
        .logout-btn:hover {
            color: #dc2626;
        }

        /* Main Content Layout */
        .container {
            max-width: 1600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            border: 1px solid #27272a;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-color);
        }

        .game-thumbnail {
            width: 100%;
            height: 120px;
            background-color: #000000;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 6px;
        }

        .game-info {
            padding: 0 8px 8px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e4e4e7;
            flex-grow: 1;
        }

        .fav-star {
            color: #71717a;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px;
        }

        .fav-star.favorited {
            color: #ef4444;
        }

        /* Badges */
        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 10;
        }

        .badge.new {
            background-color: var(--badge-new);
        }

        /* Game Player Modal & Control Toolbar */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-header-bar {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .modal-game-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .modal-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background-color: #2c2c35;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: #3f3f46;
        }

        .modal-content {
            width: 85%;
            max-width: 1000px;
            height: 75vh;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-container {
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1e;
            padding: 8px 15px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--border-color);
            border-top: none;
        }

        .close-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: #dc2626;
        }

        /* Safe Mode Floating Button */
        .safe-mode-btn {
            position: fixed;
            bottom: 15px;
            left: 15px;
            z-index: 999;
            background-color: #10b981;
            color: #ffffff;
            border: 1px solid #059669;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .safe-mode-btn.disabled {
            background-color: #3f3f46;
            color: #a1a1aa;
            border-color: #27272a;
        }

        .safe-mode-btn:hover {
            transform: scale(1.05);
        }

        /* Welcome Popup */
        #welcomePopup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .welcome-card {
            background: #1a1a1e;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            width: min(420px, 100%);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .welcome-card h2 {
            color: var(--accent-color);
            font-size: 24px;
            margin-bottom: 12px;
        }

        .welcome-card p {
            color: #e4e4e7;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .welcome-card button {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .welcome-card button:hover {
            filter: brightness(1.1);
        }
    </style>
</head>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="https://res.cloudinary.com/dodmrjlqa/image/upload/v1791501681/Screenshot_2026-10-08_192042_i7v1us.png" alt="PlayLabLite Logo" class="logo-img">
        </div>

        <div class="header-right">
            <!-- Request Games Button -->
            <a href="https://forms.gle/utxpmYeGZoXKc6kx9" target="_blank" class="request-btn">
                <i class="fas fa-paper-plane"></i> Request Games
            </a>

            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchBar" class="search-bar" placeholder="Search Game..." oninput="filterGames()">
            </div>

            <div class="header-icons">
                <!-- Favorites Filter Toggle -->
                <i class="fas fa-heart" id="favFilterBtn" title="View Favorites" onclick="toggleFavoritesFilter()"></i>

                <!-- Logged-in User Profile (the Sign in button and Community icon are added automatically) -->
                <div id="userProfile">
                    <img id="userAvatar" src="" alt="Avatar">
                    <span id="userName"></span>
                    <button class="logout-btn" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <div class="container">
        <!-- Html Games Section -->
        <section>
            <div class="section-title">Html Games</div>
            <div class="game-grid" id="htmlGamesGrid"></div>
        </section>

        <!-- Other Section -->
        <section>
            <div class="section-title">Other Tools & Links</div>
            <div class="game-grid" id="otherGamesGrid"></div>
        </section>
    </div>

    <!-- Game Player Modal & Control Toolbar -->
    <div id="modal">
        <div class="modal-header-bar">
            <span class="modal-game-title" id="modalTitle">Game Title</span>
            <div class="modal-controls">
                <button class="control-btn" onclick="popOutGame()"><i class="fas fa-external-link-alt"></i> Pop Out</button>
                <button class="control-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> Fullscreen</button>
            </div>
        </div>
        <div class="modal-content" id="modalContainer">
            <iframe id="gameFrame" src="" allow="autoplay; fullscreen; camera; microphone; display-capture; clipboard-write"></iframe>
        </div>
        <div class="close-container">
            <span id="loginPromptNotice" style="font-size: 11px; color: var(--text-muted);">Sign in to save favorites and leave comments.</span>
            <button class="close-btn" onclick="closeGame()">Close Game</button>
        </div>
    </div>

    <!-- Safe Mode Floating Button -->
    <button id="safeModeBtn" class="safe-mode-btn" onclick="toggleSafeMode()">
        <i class="fas fa-shield-alt"></i> <span id="safeModeText">SAFE MODE: ON</span>
    </button>

    <!-- Welcome Popup -->
    <div id="welcomePopup" onclick="if(event.target===this)closeWelcomePopup()">

            <h2>Read Below:</h2>
            <p>We are updating our apps and games that don't work! If you want us to add games click the top right corner!</p>

                btnText.innerText = "SAFE MODE: OFF";

            if (!isSafeMode || !text) return text;
            let cleanText = text;
            profanityList.forEach(word => {
                const regex = new RegExp(word, 'gi');
                cleanText = cleanText.replace(regex, '***');
            });
            return cleanText;
        }

        function isGameBlocked(filename, title) {
            if (!isSafeMode) return false;

            const lowerFile = filename.toLowerCase();
            return blockedKeywords.some(keyword => lowerTitle.includes(keyword) || lowerFile.includes(keyword));

                btn.classList.remove('active');
            }
            renderGames(document.getElementById('searchBar').value);

        // Render Games Grid
        function renderGames(filterText = '') {
            const htmlGrid = document.getElementById('htmlGamesGrid');
            const otherGrid = document.getElementById('otherGamesGrid');

            htmlGrid.innerHTML = '';
            otherGrid.innerHTML = '';

            const favs = getFavorites();
            let htmlCount = 0;
            let otherCount = 0;

            for (const [filename, info] of Object.entries(gameConfig)) {
                let rawTitle = info.title || filename.replace('.html', '').replace(/([A-Z])/g, ' $1').trim();

                // Safe Mode filter check (Hide bad games completely)
                if (isGameBlocked(filename, rawTitle)) {
                    continue;
                }

                let title = sanitizeText(rawTitle);

                if (filterText && !title.toLowerCase().includes(filterText.toLowerCase())) {
                    continue;
                }

                const isFav = favs.includes(filename);
                if (showOnlyFavorites && !isFav) {
                    continue;
                }

                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => openGame(filename, title);

                let thumbnailHtml = info.image ? `<img src="${info.image}" alt="${title}" class="game-thumbnail">` : `<div class="game-thumbnail"></div>`;
                const starClass = isFav ? "fas fa-heart fav-star favorited" : "far fa-heart fav-star";

                card.innerHTML = `
                    <span class="badge new">New</span>
                    ${thumbnailHtml}
                    <div class="game-info">
                        <div class="game-title">${title}</div>
                        <i class="${starClass}" onclick="toggleFavorite('${filename}', event)" title="Favorite"></i>
                    </div>
                `;

                if (info.section === 'other') {
                    otherGrid.appendChild(card);
                    otherCount++;
                } else {
                    htmlGrid.appendChild(card);
                    htmlCount++;
                }
            }

            if (otherCount === 0) otherGrid.innerHTML = '<div style="color:var(--text-muted); font-size:13px; padding:10px;">No items found.</div>';
        }

            const query = document.getElementById('searchBar').value;

            document.getElementById('gameFrame').src = '';

        }

            if (currentGameUrl) {
                window.open(currentGameUrl, '_blank');
            }
        }

            if (e.key === 'Escape') closeGame();
        });

  };
  window.handleCredentialResponse = function(){};
  window.updateUserUI = function(){};
  window.checkSavedUser = function(){};
  window.logout = function(){ auth.signOut(); };

  /* ---------- comments ---------- */
  const current = {key: null, title: ''};
  function buildPanel(){
    const p = h('div'); p.id = 'cmtPanel';
    p.innerHTML = '<div class="ch"><div><span id="cmtTitle"></span><small>Live comments. Be nice.</small></div><button class="cx" id="cmtClose"><i class="fas fa-times"></i></button></div><div id="cmtList"></div><div id="cmtForm"></div>';
    document.body.appendChild(p);
    $('cmtClose').onclick = closePanel;
  }
  function refreshComposer(){
    const f = $('cmtForm'); if (!f) return; f.innerHTML = '';
    if (!eligible(st.user)) {
      const n = h('div', 'need'); n.textContent = 'Sign in to join the conversation. '; const b = h('button', 'pl-btn', 'Sign in'); b.style.marginTop = '8px'; b.onclick = () => openAuth('Sign in to leave a comment.'); n.appendChild(h('br')); n.appendChild(b); f.appendChild(n); return;
    }
    const box = h('div', 'box'), i = h('input'); i.maxLength = 300; i.placeholder = 'Write a comment...'; const b = h('button', 'pl-btn', 'Post');
    const send = async () => {
      const t = i.value.trim(); if (!t) return;
      if (Date.now() - st.lastPost < 3000) { toast('Slow down a little.'); return; }
      st.lastPost = Date.now(); i.value = '';
      try { await db.ref('comments/' + st.panelKey).push({uid: st.user.uid, name: st.name, text: t.slice(0, 300), ts: TS}); }
      catch (e) { toast('Could not post: ' + e.message); }
    };
    b.onclick = send; i.onkeydown = e => { if (e.key === 'Enter') send(); };
    box.append(i, b); f.appendChild(box);
  }
  function openPanel(key, title){
    if (!$('cmtPanel')) buildPanel();
    st.panelKey = key; st.panelTitle = title;
    $('cmtTitle').textContent = title; $('cmtPanel').style.display = 'flex';
    refreshComposer(); subscribe();
  }
  function closePanel(){
    if (st.cmtQuery) { st.cmtQuery.off(); st.cmtQuery = null; }
    st.panelKey = null; const p = $('cmtPanel'); if (p) p.style.display = 'none';
  }
  function subscribe(){
    if (st.cmtQuery) { st.cmtQuery.off(); st.cmtQuery = null; }
    const list = $('cmtList'); list.innerHTML = '';
    const key = st.panelKey, q = db.ref('comments/' + key).orderByChild('ts').limitToLast(100); st.cmtQuery = q;
    let any = false;
    q.on('child_added', s => {
      const m = s.val(); if (!m || typeof m.text !== 'string') return;
      if (!any) { any = true; list.innerHTML = ''; }
      const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
      const c = h('div', 'cmt'); c.id = 'c_' + s.key;
      const top = h('div', 'top'); top.appendChild(h('span', 'nm', clean(m.name || 'player')));
      top.appendChild(h('span', 'tm', new Date(m.ts || Date.now()).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'})));
      if (st.user && (m.uid === st.user.uid || st.admin)) {
        const d = h('button', 'dl'); d.innerHTML = '<i class="fas fa-trash"></i>'; d.title = 'Delete';
        d.onclick = () => db.ref('comments/' + key + '/' + s.key).remove().catch(e => toast('Could not delete: ' + e.message)); top.appendChild(d);
      }
      c.appendChild(top); c.appendChild(h('div', 'tx', clean(m.text)));
      list.appendChild(c); if (atBottom || (st.user && m.uid === st.user.uid)) list.scrollTop = list.scrollHeight;
    }, err => { list.innerHTML = ''; list.appendChild(h('div', 'cmt-empty', 'Could not load comments: ' + err.message)); });
    q.on('child_removed', s => { const el = $('c_' + s.key); if (el) el.remove(); });
    q.once('value').then(s => { if (!s.exists()) { list.innerHTML = ''; list.appendChild(h('div', 'cmt-empty', 'No comments yet. Be the first!')); } });
  }

  /* ---------- hook into the page's existing game functions ---------- */
  const _open = window.openGame, _close = window.closeGame, _safe = window.toggleSafeMode;
  window.openGame = function (url, title) {
    const fr = $('gameFrame'); if (fr) fr.setAttribute('allow', IFRAME_ALLOW);   // lets Yapper use mic, camera and screen share
    current.key = gk(url); current.title = title;
    _open(url, title);
    if (st.panelKey && st.panelKey !== '__site__') openPanel(current.key, title);
  };
  window.closeGame = function () { _close(); closePanel(); current.key = null; };
  window.toggleSafeMode = function () { _safe(); if (st.panelKey) subscribe(); paintHeader(); };

  setupHeader(); paintHeader();
})();

    </script>
</body>
