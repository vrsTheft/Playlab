<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geography</title>
<script>
/* Firefox-in-WebAssembly inside an embed only works when THIS page is cross-origin
   isolated. coi-sw.js (next to this file) turns that on; without it this step is skipped. */
(() => {
  if (window.crossOriginIsolated || !window.isSecureContext || !navigator.serviceWorker) return;
  navigator.serviceWorker.register("coi-sw.js").then(reg => {
    if (navigator.serviceWorker.controller) return;
    const reload = () => { if (!sessionStorage.getItem("coi-reloaded")) { sessionStorage.setItem("coi-reloaded", "1"); location.reload(); } };
    navigator.serviceWorker.addEventListener("controllerchange", reload);
    if (reg.active) reload();
  }).catch(() => {});
})();
</script>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}
iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
}
</style>
</head>
<body>
<iframe src="https://vrstheft.github.io/firefox/"
        credentialless
        allow="cross-origin-isolated; fullscreen; clipboard-read; clipboard-write; autoplay; microphone; camera"
        allowfullscreen></iframe>
</body>
</html>
